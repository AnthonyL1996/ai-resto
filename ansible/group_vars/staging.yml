---
# Staging Environment Variables

# Application
app_name: ai-resto
app_user: airest
app_group: airest
app_home: /opt/{{ app_name }}
app_port: 8000
app_workers: 2
app_timeout: 120

# Repository
git_repo: https://github.com/AnthonyL1996/ai-resto.git
git_branch: staging
git_version: HEAD

# Python
python_version: "3.10"
virtualenv_path: "{{ app_home }}/venv"

# Database
db_name: restaurant_db_staging
db_user: restaurant
db_host: "{{ groups['dbservers'][0] }}"
db_port: 5432

# Redis
redis_host: "{{ groups['redis'][0] }}"
redis_port: 6379
redis_db: 0

# Domain and SSL
domain_name: api-staging.airestaurant.com
use_ssl: true
ssl_email: admin@airestaurant.com

# Frontend
frontend_domain: staging.airestaurant.com

# Nginx
nginx_worker_processes: 2
nginx_worker_connections: 512
nginx_client_max_body_size: 10M

# Security
allowed_hosts:
  - "{{ domain_name }}"
  - "{{ frontend_domain }}"

cors_allowed_origins:
  - "https://{{ frontend_domain }}"
  - "http://localhost:5173"  # Allow local dev

# Monitoring
enable_monitoring: false
log_level: DEBUG

# Backup
backup_enabled: false
backup_retention_days: 7

# Rate Limiting
rate_limit_enabled: true
rate_limit_per_minute: 100

# Email
smtp_server: smtp.gmail.com
smtp_port: 587
sender_email: staging@airestaurant.com

# Deployment
deploy_strategy: rolling
healthcheck_url: "http://localhost:{{ app_port }}/health"
healthcheck_retries: 3
healthcheck_delay: 5

# Systemd
systemd_restart_policy: on-failure
systemd_restart_sec: 5

# Firewall
enable_firewall: true
allowed_ports:
  - 22
  - 80
  - 443
