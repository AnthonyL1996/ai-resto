---
# Health check playbook for verifying system status
# Usage: ansible-playbook -i inventories/production healthcheck.yml

- name: Check database servers
  hosts: dbservers
  become: yes
  gather_facts: yes

  tasks:
    - name: Check PostgreSQL service status
      systemd:
        name: postgresql
      register: pg_service

    - name: Test PostgreSQL connection
      become_user: postgres
      postgresql_query:
        db: postgres
        query: SELECT version();
      register: pg_version

    - name: Check PostgreSQL connections
      become_user: postgres
      postgresql_query:
        db: postgres
        query: SELECT count(*) as connections FROM pg_stat_activity;
      register: pg_connections

    - name: Display database health
      debug:
        msg:
          - "Database Server: {{ inventory_hostname }}"
          - "Service Status: {{ pg_service.status.ActiveState }}"
          - "Version: {{ pg_version.query_result[0].version }}"
          - "Active Connections: {{ pg_connections.query_result[0].connections }}"

- name: Check Redis servers
  hosts: redis
  become: yes
  gather_facts: yes

  tasks:
    - name: Check Redis service status
      systemd:
        name: redis
      register: redis_service

    - name: Test Redis connection
      command: redis-cli ping
      register: redis_ping
      changed_when: false

    - name: Get Redis info
      command: redis-cli info server
      register: redis_info
      changed_when: false

    - name: Display Redis health
      debug:
        msg:
          - "Redis Server: {{ inventory_hostname }}"
          - "Service Status: {{ redis_service.status.ActiveState }}"
          - "Ping Response: {{ redis_ping.stdout }}"

- name: Check web servers
  hosts: webservers
  become: yes
  gather_facts: yes

  tasks:
    - name: Check application service status
      systemd:
        name: "{{ app_name }}"
      register: app_service

    - name: Check Nginx service status
      systemd:
        name: nginx
      register: nginx_service

    - name: Test application health endpoint (local)
      uri:
        url: "{{ healthcheck_url }}"
        status_code: 200
      register: local_health
      failed_when: false

    - name: Test application health endpoint (public)
      uri:
        url: "https://{{ domain_name }}/health"
        status_code: 200
        validate_certs: "{{ use_ssl }}"
      register: public_health
      failed_when: false
      delegate_to: localhost

    - name: Check disk usage
      shell: df -h {{ app_home }} | tail -1 | awk '{print $5}'
      register: disk_usage
      changed_when: false

    - name: Check system load
      command: uptime
      register: system_load
      changed_when: false

    - name: Get application logs (last 20 lines)
      command: journalctl -u {{ app_name }} -n 20 --no-pager
      register: app_logs
      changed_when: false

    - name: Display web server health
      debug:
        msg:
          - "Web Server: {{ inventory_hostname }}"
          - "Application Service: {{ app_service.status.ActiveState }}"
          - "Nginx Service: {{ nginx_service.status.ActiveState }}"
          - "Local Health Check: {{ 'PASS ✅' if local_health.status == 200 else 'FAIL ❌' }}"
          - "Public Health Check: {{ 'PASS ✅' if public_health.status == 200 else 'FAIL ❌' }}"
          - "Disk Usage: {{ disk_usage.stdout }}"
          - "System Load: {{ system_load.stdout }}"

    - name: Display recent application logs
      debug:
        msg: "{{ app_logs.stdout_lines }}"
      when: local_health.status != 200 or public_health.status != 200

- name: Health Check Summary
  hosts: localhost
  gather_facts: no

  tasks:
    - name: Display overall health summary
      debug:
        msg:
          - "════════════════════════════════════════"
          - "      HEALTH CHECK SUMMARY"
          - "════════════════════════════════════════"
          - "✅ Health check completed"
          - "Check individual server outputs above for details"
          - "════════════════════════════════════════"
