---
# PostgreSQL role - Database server setup

- name: Add PostgreSQL APT key
  apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Add PostgreSQL repository
  apt_repository:
    repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    filename: pgdg

- name: Install PostgreSQL
  apt:
    name:
      - "postgresql-{{ postgres_version | default('17') }}"
      - "postgresql-contrib-{{ postgres_version | default('17') }}"
      - postgresql-client
      - python3-psycopg2
    state: present
    update_cache: yes

- name: Ensure PostgreSQL is started and enabled
  service:
    name: postgresql
    state: started
    enabled: yes

- name: Configure PostgreSQL to listen on all interfaces
  lineinfile:
    path: "/etc/postgresql/{{ postgres_version | default('17') }}/main/postgresql.conf"
    regexp: '^#?listen_addresses'
    line: "listen_addresses = '*'"
  notify: restart postgresql

- name: Configure PostgreSQL authentication
  template:
    src: pg_hba.conf.j2
    dest: "/etc/postgresql/{{ postgres_version | default('17') }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: '0640'
  notify: restart postgresql

- name: Configure PostgreSQL settings
  template:
    src: postgresql.conf.j2
    dest: "/etc/postgresql/{{ postgres_version | default('17') }}/main/conf.d/custom.conf"
    owner: postgres
    group: postgres
    mode: '0644'
  notify: restart postgresql

- name: Create database user
  postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    role_attr_flags: CREATEDB
    state: present
  become_user: postgres

- name: Create database
  postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
    encoding: UTF8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    template: template0
    state: present
  become_user: postgres

- name: Grant database privileges
  postgresql_privs:
    database: "{{ db_name }}"
    privs: ALL
    type: database
    role: "{{ db_user }}"
    state: present
  become_user: postgres

- name: Create backup directory
  file:
    path: /var/backups/postgresql
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Install backup script
  template:
    src: backup-db.sh.j2
    dest: /usr/local/bin/backup-postgres.sh
    mode: '0755'
  when: backup_enabled | default(false)

- name: Schedule database backups
  cron:
    name: "PostgreSQL backup"
    minute: "0"
    hour: "2"
    job: "/usr/local/bin/backup-postgres.sh > /dev/null 2>&1"
    user: postgres
  when: backup_enabled | default(false)

- name: Allow PostgreSQL through firewall
  ufw:
    rule: allow
    port: "{{ postgres_port | default('5432') }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ groups['webservers'] | map('extract', hostvars, 'ansible_host') | list }}"
  when: enable_firewall | default(true)
